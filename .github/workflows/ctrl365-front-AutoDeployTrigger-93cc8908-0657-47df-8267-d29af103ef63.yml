name: Trigger auto deployment for ctrl365-front

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ staging ]
    paths:
    - '**'
    - '.github/workflows/ctrl365-front-AutoDeployTrigger-93cc8908-0657-47df-8267-d29af103ef63.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CTRL365FRONT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CTRL365FRONT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CTRL365FRONT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: stagingctrl365com.azurecr.io
          registryUsername: ${{ secrets.CTRL365FRONT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CTRL365FRONT_REGISTRY_PASSWORD }}
          containerAppName: ctrl365-front
          resourceGroup: WebCtrl365-staging
          imageToBuild: stagingctrl365com.azurecr.io/ctrl365-front:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


