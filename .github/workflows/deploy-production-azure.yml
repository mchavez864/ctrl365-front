name: Deploy Frontend to Azure Container Apps

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to staging environment?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_production == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build Next.js app
        run: |
          npm ci
          npm run build
      
      - name: Login to Azure Container Registry
        run: az acr login --name stagingctrl365com

      - name: Build and Push Docker image to ACR
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          docker build . -t ${{ secrets.ACR_LOGIN_SERVER_PROD }}/ctrl365-front:latest -t ${{ secrets.ACR_LOGIN_SERVER_PROD }}/ctrl365-front:$IMAGE_TAG
          docker push ${{ secrets.ACR_LOGIN_SERVER_PROD }}/ctrl365-front:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER_PROD }}/ctrl365-front:$IMAGE_TAG

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINERAPP_NAME_PROD }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_PROD }} \
            --image ${{ secrets.ACR_LOGIN_SERVER_PROD }}/ctrl365-front:latest
