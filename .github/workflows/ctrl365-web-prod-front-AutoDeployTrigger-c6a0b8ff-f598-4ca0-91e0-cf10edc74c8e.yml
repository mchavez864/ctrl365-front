name: Trigger auto deployment for ctrl365-web-prod-front

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ staging ]
    paths:
    - '**'
    - '.github/workflows/ctrl365-web-prod-front-AutoDeployTrigger-c6a0b8ff-f598-4ca0-91e0-cf10edc74c8e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CTRL365WEBPRODFRONT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CTRL365WEBPRODFRONT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CTRL365WEBPRODFRONT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ctrl365webprod-ajb0dnfdaagjdzfj.azurecr.io
          registryUsername: ${{ secrets.CTRL365WEBPRODFRONT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CTRL365WEBPRODFRONT_REGISTRY_PASSWORD }}
          containerAppName: ctrl365-web-prod-front
          resourceGroup: ctrl365-web-prod
          imageToBuild: ctrl365webprod-ajb0dnfdaagjdzfj.azurecr.io/ctrl365-web-prod-front:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


